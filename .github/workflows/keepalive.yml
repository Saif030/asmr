name: Keepalive

# Appwrite pauses *free* projects after 7 days of inactivity. (The Education
# plan never pauses, so this workflow is a safety net — for a Free project it
# is what keeps the project awake.)
#
# This workflow pings the app's /api/keepalive route every 3 days. It is free
# on GitHub for public and private repos.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping keepalive route
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "KEEPALIVE_URL is not set. Add it under Settings → Secrets → Actions."
            exit 0
          fi
          echo "Pinging $KEEPALIVE_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "$KEEPALIVE_URL"
          echo ""
          echo "Keepalive request finished."
